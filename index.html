<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Štúdio</title>
    <link rel="icon" href="thumbnail.png" type="image/png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.all.min.js"></script>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #141428, #05050a);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        h1 {
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 50px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(90deg, #bf00ff, #ff00ff, #bf00ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(191, 0, 255, 0.7));
            animation: shine 4s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        .controls {
            margin-top: 5px;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="file"] { display: none; }

        .file-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 14px;
            background: rgba(27, 27, 51, 0.8);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.2);
            cursor: pointer;
            transition: 0.3s;
            min-width: 200px;
            justify-content: center;
            border: 1px solid rgba(191, 0, 255, 0.3);
            font-weight: bold;
        }

        .file-btn:hover {
            background: #bf00ff;
            box-shadow: 0 0 25px rgba(191, 0, 255, 0.5);
            transform: translateY(-2px);
        }

        #removeFileBtn {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff4d4d;
            padding: 10px 15px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: none;
        }

        #removeFileBtn:hover {
            background: #ff0000;
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .main-display-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            margin-top: 10px;
        }

        canvas {
            border-radius: 15px;
            background: #000;
            box-shadow: 0 0 40px rgba(191, 0, 255, 0.25);
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 700px;
            height: 280px;
        }

        .jog-wheel {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(#111, #222, #111, #080808, #111);
            border: 10px solid #1b1b33;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(191,0,255,0.3);
            position: relative;
            cursor: grab;
            user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .jog-wheel:active { cursor: grabbing; }

        .jog-wheel::before {
            content: "";
            position: absolute;
            width: 90%; height: 90%;
            border-radius: 50%;
            border: 1px solid rgba(191, 0, 255, 0.1);
            background: repeating-radial-gradient(circle, transparent 0, transparent 5px, rgba(255,255,255,0.02) 6px);
        }

        .jog-marker {
            position: absolute;
            top: 12px;
            width: 8px;
            height: 30px;
            background: #bf00ff;
            border-radius: 4px;
            box-shadow: 0 0 15px #bf00ff;
        }

        .jog-center {
            width: 50px;
            height: 50px;
            background: #05050a;
            border-radius: 50%;
            border: 2px solid #bf00ff;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #bf00ff;
            font-weight: bold;
        }

        .seek-container {
            width: 900px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
        }

        #seekBar {
            flex-grow: 1;
            cursor: pointer;
            accent-color: #bf00ff;
            height: 6px;
        }

        .time-display {
            font-size: 14px;
            color: #bf00ff;
            font-family: monospace;
            min-width: 50px;
        }

        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 25px;
        }

        #toggleBtn {
            width: 180px;
            height: 55px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #1b1b33 0%, #3d1b4d 100%);
            color: white;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(191, 0, 255, 0.4);
        }

        #toggleBtn:hover {
            background: #bf00ff;
            transform: scale(1.05);
        }

        .dj-panel {
            background: rgba(15, 15, 30, 0.9);
            padding: 20px 25px;
            border-radius: 25px;
            border: 1px solid rgba(191, 0, 255, 0.3);
            display: flex;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .dj-controls-panel { 
            position: relative;
            flex-wrap: wrap; 
            justify-content: center;
            max-width: 1000px; 
            gap: 15px; 
            margin: 0 auto;
        }
        
        .performance-panel { 
            position: fixed;
            bottom: 20px;
            right: 30px; 
            flex-direction: column; 
            gap: 15px; 
            width: 175px; 
            align-items: stretch; 
            justify-content: center; 
        }

        .fader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .fader-wrapper {
            position: relative;
            width: 35px;
            height: 160px;
            background: #05050a;
            border-radius: 8px;
            border: 2px solid #2a1033;
            display: flex;
            justify-content: center;
            padding: 8px 0;
        }

        input[type="range"].vertical-fader {
            writing-mode: bt-lr;
            appearance: slider-vertical;
            width: 35px;
            height: 100%;
            cursor: pointer;
            background: transparent;
        }

        input[type="range"].vertical-fader::-webkit-slider-thumb {
            appearance: none;
            width: 42px;
            height: 20px;
            background: #bf00ff;
            border: 2px solid #fff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.8);
        }

        input[type="range"].vertical-fader::-moz-range-thumb {
            width: 42px;
            height: 20px;
            background: #bf00ff;
            border: 2px solid #fff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.8);
        }

        .fader-label {
            font-size: 12px;
            color: #bf00ff;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .fader-value {
            font-size: 14px;
            color: #fff;
            font-weight: bold;
            min-width: 45px;
            text-align: center;
        }

        .panel-btn {
            background: rgba(27, 27, 51, 0.8);
            border: 1px solid rgba(191, 0, 255, 0.4);
            color: white;
            padding: 13px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            transition: 0.2s;
            letter-spacing: 1.25px;
        }

        .panel-btn:hover:not(:disabled) { background: #bf00ff; border-color: white; }
        .panel-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #exportBtn {
            background: linear-gradient(135deg, #00b344 0%, #007a2e 100%);
            border-color: #00ff62;
            margin-top: 10px;
        }

        .switch-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 55px;
            height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .flip {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1b1b33;
            transition: .4s;
            border-radius: 28px;
            border: 1px solid rgba(191, 0, 255, 0.4);
        }
        .flip:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 5px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .flip { background-color: #bf00ff; }
        input:checked + .flip:before { transform: translateX(26px); }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(27, 27, 51, 0.9);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
            transition: 0.3s;
            border: 1px solid rgba(191, 0, 255, 0.2);
        }
        .back-btn:hover { background: #bf00ff; }
    </style>
</head>

    <div class="fader-container">

    <div class="fader-container">
        <span class="fader-label">LO-FI</span>

    <button id="exportBtn" class="panel-btn">📥 Export Audia</button>

<audio id="audio"></audio>

<script>
const audio = document.getElementById("audio");
const fileInput = document.getElementById("audioFile");
const removeFileBtn = document.getElementById("removeFileBtn");
const toggleBtn = document.getElementById("toggleBtn");
const btnText = document.getElementById("btnText");
const cueBtn = document.getElementById("cueBtn");
const loopToggle = document.getElementById("loopToggle");
const resetFxBtn = document.getElementById("resetFxBtn");
const exportBtn = document.getElementById("exportBtn");

// Prvky
const volumeSlider = document.getElementById("volumeSlider"); const volPercent = document.getElementById("volPercent");
const pitchSlider = document.getElementById("pitchSlider"); const pitchValue = document.getElementById("pitchValue");
const filterSlider = document.getElementById("filterSlider"); const filterLabel = document.getElementById("filterLabel");
const panSlider = document.getElementById("panSlider"); const panLabel = document.getElementById("panLabel");
const reverbSlider = document.getElementById("reverbSlider"); const reverbLabel = document.getElementById("reverbLabel");
const driveSlider = document.getElementById("driveSlider"); const driveLabel = document.getElementById("driveLabel");
const eqLowSlider = document.getElementById("eqLowSlider"); const eqLowLabel = document.getElementById("eqLowLabel");
const eqMidSlider = document.getElementById("eqMidSlider"); const eqMidLabel = document.getElementById("eqMidLabel");
const eqHighSlider = document.getElementById("eqHighSlider"); const eqHighLabel = document.getElementById("eqHighLabel");
const echoSlider = document.getElementById("echoSlider"); const echoLabel = document.getElementById("echoLabel");
const flangerSlider = document.getElementById("flangerSlider"); const flangerLabel = document.getElementById("flangerLabel");
const lofiSlider = document.getElementById("lofiSlider"); const lofiLabel = document.getElementById("lofiLabel");
const gaterSlider = document.getElementById("gaterSlider"); const gaterLabel = document.getElementById("gaterLabel");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const seekBar = document.getElementById("seekBar");
const currentTimeEl = document.getElementById("currentTime");
const durationTimeEl = document.getElementById("durationTime");
const jogWheel = document.getElementById("jogWheel");

// ==========================================
// WEB AUDIO API a VYTVORENIE VŠETKÝCH EFEKTOV
// ==========================================
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

const analyser = audioCtx.createAnalyser();
analyser.fftSize = 256;
analyser.smoothingTimeConstant = 0.85;

// Základ
const filterNode = audioCtx.createBiquadFilter(); filterNode.type = "allpass";
const panNode = audioCtx.createStereoPanner(); panNode.pan.value = 0;
const driveNode = audioCtx.createWaveShaper(); driveNode.curve = null;

const preMix = audioCtx.createGain(); 
const dryNode = audioCtx.createGain(); dryNode.gain.value = 1.0;
const wetNode = audioCtx.createGain(); wetNode.gain.value = 0.0;

// Reverb (VERB)
const convolverNode = audioCtx.createConvolver();
function createReverbBuffer(ctx, duration = 2.5, decay = 2.5) {
    const length = ctx.sampleRate * duration;
    const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
    const left = impulse.getChannelData(0);
    const right = impulse.getChannelData(1);
    for (let i = 0; i < length; i++) {
        left[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
        right[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
    return impulse;
}
convolverNode.buffer = createReverbBuffer(audioCtx);

// 3-Band EQ (LOW, MID, HIGH)
const eqLowNode = audioCtx.createBiquadFilter(); eqLowNode.type = 'lowshelf'; eqLowNode.frequency.value = 250;
const eqMidNode = audioCtx.createBiquadFilter(); eqMidNode.type = 'peaking'; eqMidNode.frequency.value = 1000;
const eqHighNode = audioCtx.createBiquadFilter(); eqHighNode.type = 'highshelf'; eqHighNode.frequency.value = 4000;

// LO-FI (Bitcrusher)
const lofiNode = audioCtx.createWaveShaper(); lofiNode.curve = null;
function makeBitcrusherCurve(bitDepth) {
    let steps = Math.pow(2, Math.max(1, bitDepth));
    let curve = new Float32Array(44100);
    for(let i=0; i<44100; i++) {
        let x = i * 2 / 44100 - 1;
        curve[i] = Math.round(x * steps) / steps;
    }
    return curve;
}

// GATER (Tremolo LFO)
const gaterNode = audioCtx.createGain(); gaterNode.gain.value = 1.0;
const gaterLFO = audioCtx.createOscillator(); gaterLFO.type = 'sine'; gaterLFO.frequency.value = 8;
const gaterDepth = audioCtx.createGain(); gaterDepth.gain.value = 0;
gaterLFO.connect(gaterDepth); gaterDepth.connect(gaterNode.gain); gaterLFO.start();

// ECHO (Delay)
const echoDelay = audioCtx.createDelay(5.0); echoDelay.delayTime.value = 0.33;
const echoFeedback = audioCtx.createGain(); echoFeedback.gain.value = 0.5;
const echoWet = audioCtx.createGain(); echoWet.gain.value = 0.0;
echoDelay.connect(echoFeedback); echoFeedback.connect(echoDelay); echoDelay.connect(echoWet);

// FLANGER 
const flangerDelay = audioCtx.createDelay(); flangerDelay.delayTime.value = 0.005;
const flangerFeedback = audioCtx.createGain(); flangerFeedback.gain.value = 0.6;
const flangerLFO = audioCtx.createOscillator(); flangerLFO.type = 'sine'; flangerLFO.frequency.value = 0.2;
const flangerDepth = audioCtx.createGain(); flangerDepth.gain.value = 0.002;
flangerLFO.connect(flangerDepth); flangerDepth.connect(flangerDelay.delayTime); flangerLFO.start();
const flangerWet = audioCtx.createGain(); flangerWet.gain.value = 0.0;
flangerDelay.connect(flangerFeedback); flangerFeedback.connect(flangerDelay); flangerDelay.connect(flangerWet);

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

let source;
let isPlaying = false;
let isDraggingSeek = false;
let fileLoaded = false;
let rawAudioBuffer = null;

let jogRotation = 0;
let isJogging = false;
let lastAngle = 0;
let wasPlayingBeforeJog = false;
let virtualTime = 0;

// JOG WHEEL LOGIKA
function getAngle(x, y) {
    const rect = jogWheel.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    return Math.atan2(y - centerY, x - centerX);
}

jogWheel.addEventListener('mousedown', (e) => {
    if (!checkFile()) return;
    isJogging = true;
    wasPlayingBeforeJog = !audio.paused; 
    audio.pause(); 
    virtualTime = audio.currentTime;
    lastAngle = getAngle(e.clientX, e.clientY);
});



window.addEventListener('mousemove', (e) => {
    if (!isJogging) return;
    const currentAngle = getAngle(e.clientX, e.clientY);
    let delta = currentAngle - lastAngle; // toto je v radiánoch
    
    if (delta > Math.PI) delta -= Math.PI * 2;
    if (delta < -Math.PI) delta += Math.PI * 2;
    
    let deltaDeg = delta * (180 / Math.PI); // premeníme na reálne stupne
    
    // --- OPRAVA: Pevný pomer! 90 stupňov = 1 sekunda zvuku ---
    let timeChange = deltaDeg / 90; 
    let novyCas = virtualTime + timeChange;
    
    // Hranice pesničky
    if (novyCas <= 0) {
        timeChange = -virtualTime;
        novyCas = 0;
    } else if (audio.duration && novyCas >= audio.duration) {
        timeChange = audio.duration - virtualTime;
        novyCas = audio.duration;
    }
    
    if (timeChange !== 0) {
        virtualTime = novyCas;
        
        // Vizuálna rotácia teraz presne kopíruje reálny čas zvuku
        jogWheel.style.transform = `rotate(${virtualTime * 90}deg)`;
        
        seekBar.value = virtualTime;
        currentTimeEl.textContent = formatTime(virtualTime);

        if (rawAudioBuffer && Math.abs(timeChange) > 0.01) {
            let scratchSrc = audioCtx.createBufferSource();
            scratchSrc.buffer = rawAudioBuffer;
            scratchSrc.playbackRate.value = Math.abs(timeChange) * 30; // Zvuk upravený pre plynulosť
            
            let scratchVolume = audioCtx.createGain();
            scratchVolume.gain.value = audio.volume; 

            scratchSrc.connect(scratchVolume);
            scratchVolume.connect(lofiNode);
            
            scratchSrc.start(0, virtualTime, 0.05);
        }
    }

    lastAngle = currentAngle;
});
window.addEventListener('mouseup', () => {
    if (!isJogging) return;
    isJogging = false;

function makeDistortionCurve(amount) {
    let k = amount, n_samples = 44100, curve = new Float32Array(n_samples);
    for (let i = 0; i < n_samples; ++i ) {
        let x = i * 2 / n_samples - 1;
        curve[i] = (3 + k) * x * 20 * (Math.PI / 180) / (Math.PI + k * Math.abs(x));
    }
    return curve;
}

fileInput.addEventListener("change", async function () {
    const file = this.files[0]; if (!file) return;
    
    audio.pause(); isPlaying = false; btnText.textContent = "Štart";
    toggleBtn.querySelector(".icon").textContent = "▶"; seekBar.value = 0; currentTimeEl.textContent = "0:00";

    document.getElementById("fileName").textContent = "Načítavam..."; 
    removeFileBtn.style.display = "none";

    try {
        const arrayBuffer = await file.arrayBuffer();
        rawAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
        
        audio.src = URL.createObjectURL(file);
        audio.load();
        
        if (!source) {
            source = audioCtx.createMediaElementSource(audio);
            // SÉRIOVÉ ZAPOJENIE
            source.connect(lofiNode);
            lofiNode.connect(gaterNode);
            gaterNode.connect(eqLowNode);
            eqLowNode.connect(eqMidNode);
            eqMidNode.connect(eqHighNode);
            eqHighNode.connect(driveNode);
            driveNode.connect(filterNode);
            filterNode.connect(panNode);
            panNode.connect(preMix); 
            
            // PARALELNÉ EFEKTY
            preMix.connect(dryNode); 
            preMix.connect(convolverNode); convolverNode.connect(wetNode); 
            preMix.connect(echoDelay); 
            preMix.connect(flangerDelay); 
            
            // VŠETKO DO ANALYZÁTORA A DO REPRODUKTOROV

            wetNode.connect(analyser);
            echoWet.connect(analyser);

toggleBtn.addEventListener("click", async () => {

function formatTime(s) { if(isNaN(s)) return "0:00"; let m=Math.floor(s/60), r=Math.floor(s%60); return m+":"+(r<10?"0":"")+r; }

// EXPORT DO MP3 / WAV
exportBtn.addEventListener("click", async () => {
    if (!checkFile() || !rawAudioBuffer) return;
    exportBtn.disabled = true; exportBtn.textContent = "Pripravujem...";
    
    const playbackRate = parseFloat(pitchSlider.value);
    
    const newDuration = rawAudioBuffer.duration / playbackRate;
    const sampleRate = rawAudioBuffer.sampleRate;
    
    const lengthInSamples = Math.ceil(newDuration * sampleRate);
    const offlineCtx = new OfflineAudioContext(2, lengthInSamples, sampleRate);
    
    const offlineSource = offlineCtx.createBufferSource();
    offlineSource.buffer = rawAudioBuffer;
    offlineSource.playbackRate.value = playbackRate;
    
    const offLofi = offlineCtx.createWaveShaper(); offLofi.curve = lofiNode.curve;
    const offGater = offlineCtx.createGain(); offGater.gain.value = gaterNode.gain.value;
    const offGaterLFO = offlineCtx.createOscillator(); offGaterLFO.type = 'sine'; offGaterLFO.frequency.value = 8;
    const offGaterDepth = offlineCtx.createGain(); offGaterDepth.gain.value = gaterDepth.gain.value;
    offGaterLFO.connect(offGaterDepth); offGaterDepth.connect(offGater.gain); offGaterLFO.start();

    const offEqLow = offlineCtx.createBiquadFilter(); offEqLow.type = 'lowshelf'; offEqLow.frequency.value = 250; offEqLow.gain.value = eqLowNode.gain.value;
    const offEqMid = offlineCtx.createBiquadFilter(); offEqMid.type = 'peaking'; offEqMid.frequency.value = 1000; offEqMid.gain.value = eqMidNode.gain.value;
    const offEqHigh = offlineCtx.createBiquadFilter(); offEqHigh.type = 'highshelf'; offEqHigh.frequency.value = 4000; offEqHigh.gain.value = eqHighNode.gain.value;

    const offDrive = offlineCtx.createWaveShaper(); offDrive.curve = driveNode.curve;
    const offFilter = offlineCtx.createBiquadFilter(); offFilter.type = filterNode.type; offFilter.frequency.value = filterNode.frequency.value;
    const offPan = offlineCtx.createStereoPanner(); offPan.pan.value = panNode.pan.value;
    const offPreMix = offlineCtx.createGain();
    const offDry = offlineCtx.createGain(); offDry.gain.value = dryNode.gain.value;
    const offWet = offlineCtx.createGain(); offWet.gain.value = wetNode.gain.value;
    const offMasterVolume = offlineCtx.createGain(); offMasterVolume.gain.value = audio.volume;
    
    const offConvolver = offlineCtx.createConvolver(); offConvolver.buffer = convolverNode.buffer;

    const offEchoDelay = offlineCtx.createDelay(5.0); offEchoDelay.delayTime.value = 0.33;
    const offEchoFeedback = offlineCtx.createGain(); offEchoFeedback.gain.value = 0.5;
    const offEchoWet = offlineCtx.createGain(); offEchoWet.gain.value = echoWet.gain.value;
    offEchoDelay.connect(offEchoFeedback); offEchoFeedback.connect(offEchoDelay); offEchoDelay.connect(offEchoWet);

    const offFlangerDelay = offlineCtx.createDelay(); offFlangerDelay.delayTime.value = 0.005;
    const offFlangerFeedback = offlineCtx.createGain(); offFlangerFeedback.gain.value = 0.6;
    const offFlangerLFO = offlineCtx.createOscillator(); offFlangerLFO.type = 'sine'; offFlangerLFO.frequency.value = 0.2;
    const offFlangerDepth = offlineCtx.createGain(); offFlangerDepth.gain.value = 0.002;
    offFlangerLFO.connect(offFlangerDepth); offFlangerDepth.connect(offFlangerDelay.delayTime); offFlangerLFO.start();
    const offFlangerWet = offlineCtx.createGain(); offFlangerWet.gain.value = flangerWet.gain.value;
    offFlangerDelay.connect(offFlangerFeedback); offFlangerFeedback.connect(offFlangerDelay); offFlangerDelay.connect(offFlangerWet);

    offlineSource.connect(offLofi);
    offLofi.connect(offGater);
    offGater.connect(offEqLow); offEqLow.connect(offEqMid); offEqMid.connect(offEqHigh);
    offEqHigh.connect(offDrive); offDrive.connect(offFilter); offFilter.connect(offPan);
    offPan.connect(offPreMix);
    
    offPreMix.connect(offDry); 
    offPreMix.connect(offConvolver); offConvolver.connect(offWet);
    offPreMix.connect(offEchoDelay);
    offPreMix.connect(offFlangerDelay);
    
    offDry.connect(offMasterVolume);
    offWet.connect(offMasterVolume);
    offEchoWet.connect(offMasterVolume);
    offFlangerWet.connect(offMasterVolume);
    
    offMasterVolume.connect(offlineCtx.destination);
    
    offlineSource.start();
    const renderedBuffer = await offlineCtx.startRendering();

    try {
        if ('showSaveFilePicker' in window) {
            const handle = await window.showSaveFilePicker({
                suggestedName: 'moj-mix.mp3',
                types: [
                    { description: 'MP3 Audio (Komprimované)', accept: {'audio/mpeg': ['.mp3']} },
                    { description: 'WAVE Audio (Štúdiová kvalita)', accept: {'audio/wav': ['.wav']} }
                ]
            });
            const fileExtension = handle.name.split('.').pop().toLowerCase();
            const writable = await handle.createWritable();
            if (fileExtension === 'wav') { await writable.write(bufferToWave(renderedBuffer, renderedBuffer.length)); } 
            else { exportBtn.textContent = "Enkódujem MP3..."; await writable.write(bufferToMp3(renderedBuffer)); }
            await writable.close();
        } else {
            let fullFileName = prompt("Zadaj názov súboru s príponou (.mp3 alebo .wav):", "upravene.mp3");
            if (!fullFileName) throw new Error("Zrušené");
            let finalBlob = (fullFileName.split('.').pop().toLowerCase() === 'wav') ? bufferToWave(renderedBuffer, renderedBuffer.length) : bufferToMp3(renderedBuffer);
            const url = URL.createObjectURL(finalBlob);
            const anchor = document.createElement("a"); anchor.href = url; anchor.download = fullFileName; anchor.click(); URL.revokeObjectURL(url);
        }
    } catch (err) { console.log("Export zrušený."); }

    exportBtn.disabled = false; exportBtn.textContent = "📥 Export Track";
});

function bufferToMp3(buffer) {
    const channels = buffer.numberOfChannels; const sampleRate = buffer.sampleRate;
    const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128); const mp3Data = [];
    const left = buffer.getChannelData(0); const right = channels > 1 ? buffer.getChannelData(1) : left;
    const lPCM = new Int16Array(left.length); const rPCM = new Int16Array(right.length);
    for (let i = 0; i < left.length; i++) {
        lPCM[i] = Math.max(-1, Math.min(1, left[i])) * 32767; rPCM[i] = Math.max(-1, Math.min(1, right[i])) * 32767;
    }
    for (let i = 0; i < lPCM.length; i += 1152) {
        const mp3buf = mp3encoder.encodeBuffer(lPCM.subarray(i, i + 1152), rPCM.subarray(i, i + 1152));
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
    }
    const flush = mp3encoder.flush(); if (flush.length > 0) mp3Data.push(flush);
    return new Blob(mp3Data, { type: 'audio/mpeg' });
}

function bufferToWave(abuffer, len) {
    let numOfChan = abuffer.numberOfChannels, length = len * numOfChan * 2 + 44, buffer = new ArrayBuffer(length), view = new DataView(buffer), channels = [], i, sample, offset = 0, pos = 0;
    function setUint16(data) { view.setUint16(pos, data, true); pos += 2; } function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
    setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
    setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
    for(i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));
    while(pos < length) {
        for(i = 0; i < numOfChan; i++) {
            sample = Math.max(-1, Math.min(1, channels[i][offset])); sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
            view.setInt16(pos, sample, true); pos += 2;
        }
        offset++;
    }
    return new Blob([buffer], {type: "audio/wav"});
}

function draw() {
    requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);
    
    ctx.fillStyle = "#000"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const usefulLength = Math.floor(bufferLength * 0.7);
    const barWidth = (canvas.width / usefulLength) * 1.5;
    let x = 0;
    
    for (let i = 0; i < usefulLength; i++) {
        let barHeight = dataArray[i]; 
        let percentX = i / usefulLength;
        ctx.fillStyle = `rgb(${barHeight + (50 * percentX)}, ${150 * percentX}, ${255 - (100 * percentX)})`;
        
        let normalized = barHeight / 255;
        let dynamicHeight = Math.pow(normalized, 2.5);
        let visualBoost = 1 + (percentX * 0.8); 
        let finalHeight = Math.max(2, dynamicHeight * canvas.height * visualBoost);
        
        ctx.fillRect(x, canvas.height - finalHeight, barWidth, finalHeight);
        x += barWidth + 2;
    }

    if (isPlaying && !isDraggingSeek && !isJogging) {
        // Všetko ide synchrónne a len vtedy, ak zrovna neťaháš posuvník ani netočíš kolieskom
        seekBar.value = audio.currentTime;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        jogWheel.style.transform = `rotate(${audio.currentTime * 90}deg)`;
    }
}
draw();
